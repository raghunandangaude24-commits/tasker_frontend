<!-- tasks.html -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Tasker - Tasks</title>

    <link rel="stylesheet" href="tasks.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

</head>

<body>

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-layer-group"></i>

            <h2>Tasker</h2>

        </div>

        <ul class="menu">

            <li>
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li class="active">
                <a href="tasks.html">
                    <i class="fa-solid fa-list-check"></i>
                    Tasks
                </a>
            </li>

            <li>
                <a href="analytics.html">
                    <i class="fa-solid fa-chart-simple"></i>
                    Analytics
                </a>
            </li>

            <li>
                <a href="settings.html">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>
            </li>

        </ul>

    </aside>

    <!-- MAIN CONTENT -->

    <main class="main-content">

        <!-- TOPBAR -->

        <header class="topbar">

            <div>

                <h1>Tasks</h1>

                <p>Organize and manage all your work</p>

            </div>

            <button class="add-task-btn" id="openModal">

                <i class="fa-solid fa-plus"></i>

                Add Task

            </button>

        </header>

        <!-- FILTERS -->

        <section class="filters">

            <input type="text" id="searchTask" placeholder="Search Tasks..." />

            <select id="filterPriority">

                <option value="All">All Priorities</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>

            </select>

        </section>

        <!-- TASKS GRID -->

        <section class="tasks-grid" id="taskContainer">

            <!-- TASKS HERE -->

        </section>

    </main>

    <!-- MODAL -->

    <div class="modal" id="taskModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2>Create New Task</h2>

                <span class="close-btn" id="closeModal">
                    &times;
                </span>

            </div>

            <form id="taskForm">

                <input type="text" id="taskTitle" placeholder="Task Title" required />

                <textarea id="taskDescription" placeholder="Task Description" required></textarea>

                <input type="date" id="taskDate" required />

                <select id="taskPriority">

                    <option value="High">High Priority</option>
                    <option value="Medium">Medium Priority</option>
                    <option value="Low">Low Priority</option>

                </select>

                <button type="submit">
                    Save Task
                </button>

            </form>

        </div>

    </div>

    <script src="tasks.js"></script>

</body>

</html>
